# Decap CMS Configuration for LiSi Energy Website

backend:
  name: github
  branch: main
  repo: ZJ/lith-silicon-site
  site_domain: https://lith-silicon.vercel.app
  base_url: https://lith-silicon.vercel.app
  auth_endpoint: oauth

media_folder: public/uploads
public_folder: /uploads

collections:
  # Blog Posts
  - name: blog
    label: 博客文章
    folder: content/blog
    create: true
    slug: '{{slug}}'
    fields:
      - { label: '日期', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - { label: '分类（中文）', name: 'category', widget: 'string' }
      - { label: '分类（英文）', name: 'categoryEn', widget: 'string' }
      - { label: '标题（中文）', name: 'title', widget: 'string' }
      - { label: '标题（英文）', name: 'titleEn', widget: 'string' }
      - { label: '摘要（中文）', name: 'excerpt', widget: 'string' }
      - { label: '摘要（英文）', name: 'excerptEn', widget: 'string' }
      - { label: '标签（中文）', name: 'tags', widget: 'list', allow_add: true }
      - { label: '标签（英文）', name: 'tagsEn', widget: 'list', allow_add: true }
      - { label: '正文（中文）', name: 'body', widget: 'markdown' }
      - { label: '正文（英文）', name: 'contentEn', widget: 'markdown', required: false }

  # Site Settings
  - name: settings
    label: 网站设置
    files:
      - label: 首页内容
        name: homepage
        file: src/utils/site.ts
        fields:
          - { label: '副标题', name: 'hero_subtitle', widget: 'string' }
          - { label: '使命宣言', name: 'mission', widget: 'string' }

      - label: 联系方式
        name: contact
        file: src/pages/contact.astro
        fields:
          - { label: '邮箱', name: 'email', widget: 'string' }
          - { label: '地址', name: 'location', widget: 'string' }
